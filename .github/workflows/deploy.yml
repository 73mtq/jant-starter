# Deploy your Jant site to Cloudflare Workers.
#
# Prerequisites:
# 1. Create a D1 database: npx wrangler d1 create <name>
# 2. Update wrangler.toml with the database_id
# 3. Add repository secrets: CF_API_TOKEN, CF_ACCOUNT_ID
# 4. Set production secret: npx wrangler secret put AUTH_SECRET
#
# The API token needs Workers Scripts, D1, R2, and Workers Routes edit
# permissions plus Zone Read, because wrangler.toml declares a route by
# zone_name.
#
# Full setup guide: https://github.com/jant-me/jant

name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deploy prerequisites
        id: preflight
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu

          if [ -z "${CF_API_TOKEN}" ] || [ -z "${CF_ACCOUNT_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "Add \`CF_API_TOKEN\` and \`CF_ACCOUNT_ID\` in GitHub Actions secrets to enable auto-deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          database_id="$(sed -n 's/^database_id = "\\([^"]*\\)".*/\\1/p' wrangler.toml | head -n 1)"

          if [ -z "${database_id}" ] || [ "${database_id}" = "local" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo
              echo "Replace the placeholder D1 \`database_id\` in \`wrangler.toml\` before enabling auto-deploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"

      # `npm run deploy` prepares dist/public, applies remote migrations and
      # data backfills, then uploads the Worker with those static assets.
      # Calling `wrangler deploy` directly would fail: the asset directory is
      # built, not committed.
      - name: Deploy
        if: steps.preflight.outputs.ready == 'true'
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # A deploy without an API token cannot reach Cloudflare. Stop here and
      # say so, so a green run is never taken for a published site.
      - name: Verify the site answers
        if: steps.preflight.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for path in / /feed /robots.txt; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://www.feiyisc.top$path")
            echo "$path -> $status"
            if [ "$status" != "200" ]; then
              echo "Expected 200 from https://www.feiyisc.top$path" >&2
              exit 1
            fi
          done
          rules=$(curl -s --max-time 30 https://www.feiyisc.top/robots.txt)
          case "$rules" in
            *"Disallow: /search"*) echo "robots.txt carries Disallow: /search" ;;
            *) echo "robots.txt is missing Disallow: /search" >&2; exit 1 ;;
          esac
